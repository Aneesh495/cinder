name: Cinder deterministic bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install declared tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake binutils python3 curl gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/cinder-llvm.asc
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/cinder-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/cinder-llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          gcc --version
          clang-22 --version
      - name: Build seed driver
        run: make build
      - name: Compile and execute all bootstrap stages
        run: make selfhost
      - name: Upload raw stage and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinder-bootstrap
          path: .agent-local/selfhost
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: error
