name: Cinder complete acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake binutils python3 curl gnupg gdb
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/cinder-llvm.asc
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/cinder-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/cinder-llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 llvm-22 libclang-rt-22-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Build bound seed compiler
        run: make build
      - name: Execute every full acceptance gate
        run: make acceptance
      - name: Verify existing evidence without execution
        run: |
          make verify
          python3 -B tests/test_release_evidence.py build/cindercc
      - name: Archive all raw acceptance evidence
        if: always()
        run: |
          if test -d .agent-local; then
            tar -czf "$RUNNER_TEMP/cinder-complete-acceptance.tar.gz" .agent-local build
          fi
      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinder-complete-acceptance
          path: ${{ runner.temp }}/cinder-complete-acceptance.tar.gz
          compression-level: 1
          if-no-files-found: error
