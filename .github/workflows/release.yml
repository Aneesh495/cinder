name: Cinder complete acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_DATE_EPOCH: '0'

jobs:
  seed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-tools
      - name: Build the shared bound compiler and probes
        run: |
          make build
          cmake --build build --parallel 4 --target cinder_ir_campaign cinder_unwind_probe cinder_debug_line_probe cinder_debug_type_probe cinder_source_buffer_probe
          tar -czf "$RUNNER_TEMP/cinder-seed.tar.gz" build
      - uses: actions/upload-artifact@v4
        with:
          name: cinder-release-seed
          path: ${{ runner.temp }}/cinder-seed.tar.gz

  campaign:
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        gate:
          - abi
          - allocation
          - applications
          - authored-suite
          - debugging
          - differential-programs
          - documentation-product
          - failure-recovery
          - feature-families
          - fresh-build
          - ir-semantics
          - native-fuzzing
          - nonvacuous-passes
          - object-output
          - original-pipeline
          - performance
          - private-size
          - rewrite-validation
          - self-hosting
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-tools
      - uses: actions/download-artifact@v4
        with:
          name: cinder-release-seed
          path: ${{ runner.temp }}/seed
      - name: Restore exact shared seed bytes
        run: tar -xzf "$RUNNER_TEMP/seed/cinder-seed.tar.gz"
      - name: Execute and verify the selected complete campaign
        env:
          CINDER_RELEASE_GATE: ${{ matrix.gate }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0,'tools')
          from gate_registry import read_gate_report
          key=os.environ['CINDER_RELEASE_GATE']
          result=subprocess.run([sys.executable,'-B','tools/acceptance.py','run','build/cindercc','--gate',key])
          assert result.returncode==1, 'a selected subset must remain incomplete'
          root=pathlib.Path('.').resolve();base=root/'.agent-local/evidence'
          manifest=json.loads((base/'ACCEPTANCE.json').read_text())
          gate=manifest['gates'][key]
          assert gate['status']=='pass', gate
          read_gate_report(key,json.loads((base/gate['report']).read_text()),root,base,root/'build/cindercc')
          PY
      - name: Archive the complete raw campaign
        if: always()
        run: |
          if test -d .agent-local/evidence; then
            tar -czf "$RUNNER_TEMP/cinder-gate.tar.gz" .agent-local/evidence
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-gate-${{ matrix.gate }}
          path: ${{ runner.temp }}/cinder-gate.tar.gz
          compression-level: 1
          if-no-files-found: error

  verify:
    needs: campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-tools
      - uses: actions/download-artifact@v4
        with:
          name: cinder-release-seed
          path: ${{ runner.temp }}/seed
      - run: tar -xzf "$RUNNER_TEMP/seed/cinder-seed.tar.gz"
      - uses: actions/download-artifact@v4
        with:
          pattern: cinder-gate-*
          path: ${{ runner.temp }}/campaigns
      - name: Extract original POSIX evidence packages
        run: |
          python3 -B - <<'PY'
          import os, pathlib, tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'campaigns'
          for archive in root.glob('*/cinder-gate.tar.gz'):
              with tarfile.open(archive) as stream:
                  stream.extractall(archive.parent,filter='data')
              archive.unlink()
          PY
      - name: Verify every raw campaign and the hosted published tip
        run: |
          python3 -B tools/assemble_acceptance.py build/cindercc "$RUNNER_TEMP/campaigns"
          make verify
          python3 -B tests/test_release_evidence.py build/cindercc
      - name: Archive all verified release evidence
        if: always()
        run: |
          if test -d .agent-local/evidence; then
            tar -czf "$RUNNER_TEMP/cinder-complete-acceptance.tar.gz" .agent-local/evidence build
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-complete-acceptance
          path: ${{ runner.temp }}/cinder-complete-acceptance.tar.gz
          compression-level: 1
          if-no-files-found: error
