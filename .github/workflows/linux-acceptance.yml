name: Cinder Linux validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build binutils gdb python3 curl gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/cinder-llvm.asc
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/cinder-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/cinder-llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 libclang-rt-22-dev lldb-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          gcc --version
          clang-22 --version
      - name: Build
        run: make build
      - name: Frontend and object checks
        run: make test test-frontend test-globals test-multi test-preprocessor test-ir test-ir-text test-ir-campaign test-ssa test-control test-constraints test-undefined test-memory test-literals test-linkage test-static-addresses test-initializers test-aggregates test-compound-literals test-numeric test-storage test-census test-allocation test-parallel-copy test-float test-varargs test-apps test-generated test-abi test-object test-output
      - name: Native Linux execution
        run: tests/run_native_linux.sh build/cindercc
      - name: Static assertion declarations
        run: make test-static-assert
      - name: Generic selections
        run: make test-generic
      - name: Object and member alignment
        run: make test-alignment
      - name: Nonreturning function contracts
        run: make test-noreturn
      - name: Block storage and cross-unit linkage
        run: make test-block-storage
      - name: Labels, jumps, and object lifetimes
        run: make test-goto
      - name: Switch dispatch and nested control scopes
        run: make test-switch
      - name: Register storage and variadic parameter eligibility
        run: make test-register
      - name: Target offsetof and fundamental headers
        run: make test-offset
      - name: Authored target libc and POSIX interfaces
        run: make test-runtime-headers
      - name: Flexible arrays and allocated native storage
        run: make test-flexible
      - name: Anonymous members, nested initialization, and ABI
        run: make test-anonymous
      - name: Bitfield packing, masked updates, and ABI
        run: make test-bitfields
      - name: Union alternatives and declared const origins
        run: make test-qualifiers
      - name: Optimizer semantic and transformation boundaries
        run: make test-optimizer
      - name: Independent integer rewrite validation
        run: make test-rewrites
      - name: Authored aggregate ABI checks
        run: make test-aggregate-abi
      - name: Scalar callback ABI campaign
        run: make test-abi-callbacks
      - name: Aggregate callback ABI campaign
        run: make test-abi-aggregates
      - name: Authored dynamic variadic checks
        run: make test-variadic
      - name: Variadic callbacks and va_list interchange
        run: make test-abi-variadic
      - name: Multi-unit object and assembly campaign
        run: make test-object-campaign
      - name: Sanitizer build
        run: make fuzz
      - name: Evidence integrity checks
        run: make test-evidence
      - name: Incremental evidence inventory
        run: python3 -B tools/acceptance.py snapshot build/cindercc
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinder-linux-acceptance
          path: |
            .agent-local/evidence
            .agent-local/generated-summary.json
            .agent-local/ir-text
            .agent-local/ir-campaign
            .agent-local/ssa
            .agent-local/control
            .agent-local/constraints
            .agent-local/memory
            .agent-local/literals
            .agent-local/linkage
            .agent-local/static-addresses
            .agent-local/initializers
            .agent-local/aggregates
            .agent-local/compound_literals
            .agent-local/static_assertions
            .agent-local/generic
            .agent-local/alignment
            .agent-local/alignment-contracts
            .agent-local/noreturn
            .agent-local/noreturn-contracts
            .agent-local/block_storage
            .agent-local/block-storage-contracts
            .agent-local/goto
            .agent-local/goto-contracts
            .agent-local/switch
            .agent-local/switch-contracts
            .agent-local/register
            .agent-local/register-contracts
            .agent-local/offset
            .agent-local/offset-contracts
            .agent-local/runtime-headers
            .agent-local/flexible
            .agent-local/flexible-contracts
            .agent-local/flexible-allocated
            .agent-local/anonymous
            .agent-local/anonymous-contracts
            .agent-local/anonymous-abi-contracts
            .agent-local/bitfields
            .agent-local/bitfield-contracts
            .agent-local/qualifiers
            .agent-local/qualifier-contracts
            .agent-local/cfg-optimization
            .agent-local/sparse-optimization
            .agent-local/value-numbering
            .agent-local/dead-code
            .agent-local/strength-reduction
            .agent-local/rewrite-checks
            .agent-local/bitfields-abi-contracts
            .agent-local/flexible-abi-contracts
            .agent-local/aggregate_abi
            .agent-local/abi-boundary
            .agent-local/abi-callbacks
            .agent-local/abi-aggregates
            .agent-local/abi-variadic
            .agent-local/variadic
            .agent-local/allocation
            .agent-local/objects
            artifacts
            build
          if-no-files-found: ignore
