name: Native Cinder toolchain
description: Install the declared Linux compiler, debugger and inspection tools.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake binutils python3 curl gnupg gdb
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
        test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/cinder-llvm.asc
        printf '%s\n' 'deb [signed-by=/usr/share/keyrings/cinder-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/cinder-llvm.list
        sudo apt-get update
        sudo apt-get install -y clang-22 llvm-22 libclang-rt-22-dev
        echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
